name: CI/CD - Build Web Docker & Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --- JOB 1: BUILD & PUSH WEB DOCKER IMAGE FOR CASAOS ---
  build-web-docker:
    name: Build & Push Web Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/jast-frontend:latest

  # --- JOB 2: BUILD ANDROID APK ---
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies with uv
        run: uv sync

      - name: Build APK via Flet Action
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          project-path: .
          build-number: ${{ github.run_number }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: jast-android-app
          path: build/apk/*.apk
